; Advanced Crash Reporter - configuration
; Lives next to the .asi in bin\x64\plugins\AdvancedCrashReporter\config.ini
; Every value below is the default; delete the file to get defaults back.

[general]
enabled   = 1
; debug | info | warn | error
log_level = info
; Leave empty to write reports to
;   bin\x64\plugins\AdvancedCrashReporter\reports
output_dir =

[watch]
; Rolling snapshots of every thread, written unconditionally on a timer and
; overwritten in rotation (reports\watch\watch-NN.txt).
;
; This is the safety net. Stall heuristics can miss: a thread looping deep
; inside one call keeps changing its top frames and resets the timer. These
; snapshots mean that whatever kills the game, there is a full thread dump
; from at most interval_seconds ago. After a watchdog timeout, read the
; GameThread first. (The thread id at the end of a REDEngine report folder
; name is the engine's WatchdogThread, not the thread that was stuck.)
enabled = 0
interval_seconds = 25
ring_size = 8
; How often every thread is captured and its "unchanged for" timer updated.
; Also drives the heartbeat line in the log.
sweep_interval_ms = 60000
; A thread unchanged this long is flagged as stalled in reports and heartbeats.
thread_stall_seconds = 30
; ANY thread (not just the main one) unchanged this long triggers a full
; report. 0 = disabled, which is the default and recommended: an engine worker
; parked waiting for a job is indistinguishable from one wedged mid-job, so
; this fires on healthy threads. The snapshots above already capture the same
; evidence without having to guess. Set to e.g. 75 only if you want the extra
; reports and can live with false positives.
thread_stall_report_seconds = 0

[hang]
; Main-thread-specific escalation. Kept because a frozen main thread is the
; clearest signal when it does happen, and it escalates faster than the
; generic sweep above.
enabled = 1
sample_interval_ms = 1000
; Seconds of an unmoving main thread at which a report is written. The last
; value must stay under 120 or the engine watchdog wins the race.
stall_report_seconds = 25,60,100,115
max_reports = 6
; Include every other thread's stack in the report. Worth keeping on: a hung
; main thread is often waiting on a worker that is itself stuck in a mod.
dump_all_threads = 1
; Ignore stalls for this long after startup.
grace_seconds = 5

[exception]
; Catches EXCEPTION_ACCESS_VIOLATION and friends with a resolved stack.
enabled = 1
; Report faults as they happen, before anything gets a chance to swallow them.
; Set to 0 if you only want faults that actually kill the game.
; Access violations and heap corruption are always reported, whatever the
; three settings here say: the game ends itself on the first one, so their
; first chance is the only one there is.
first_chance = 1
; Only report the first fault seen at any given code address.
dedupe = 1
max_reports = 12

[modules]
; How often the module table is refreshed. This also produces the load
; timeline used to spot a mod that takes forever to initialise.
scan_interval_ms = 2000
timeline = 1
; A load gap above this is flagged as a slow loader in the report.
slow_load_warn_ms = 3000

[logs]
; Pull the tail of every mod log into the report.
harvest = 1
tail_lines = 60

[inventory]
; Write a one-off snapshot of the installed mod set at startup.
enabled = 1

[system]
; End each report with the PC's configuration (Windows, CPU, RAM, GPU and
; driver, page file, displays, the game's drive) and the game's graphics
; settings (upscaler, frame generation, ray/path tracing, quality). Nothing
; that identifies you: no computer name, account name or serial numbers.
enabled = 1

[dialog]
; The window shown when the game dies (bin\x64\CrashReporter.exe). It points
; at this plugin's report for the crash, with "Open report" and "Close" in
; place of the game's "Send report" and "Don't send". When there is no report
; to show, it opens the game's own dialog instead.
; 0 = always show the game's own dialog.
enabled = 1
